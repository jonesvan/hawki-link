<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Hawki Link</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">H</span>
        <div class="brand-text">
          <strong>Hawki Link</strong>
          <span class="sub" id="model">deepseek-flash</span>
        </div>
      </div>
      <button id="settings" class="icon-btn" title="Settings">&#9881;</button>
    </header>

    <main id="log" class="log" aria-live="polite">
      <div class="empty">
        Give the agent a goal and it runs to the end by itself, e.g.
        <em>&ldquo;Find the top 3 cited papers on transformer interpretability on
        Google Scholar.&rdquo;</em>
      </div>
    </main>

    <form id="composer" class="composer">
      <textarea
        id="goal"
        rows="2"
        placeholder="Tell Hawki what to do&hellip;"
      ></textarea>
      <div class="actions">
        <button type="submit" id="run" class="primary">Run</button>
        <button type="button" id="stop" class="ghost" disabled>Stop</button>
      </div>
    </form>

    <script src="popup.js" type="module"></script>
  </body>
</html>
